# ===========================
# MySQL Profile Configuration
# Set spring.profiles.active=mysql in application.properties to activate
# ===========================

spring.datasource.url=jdbc:mysql://localhost:3306/tasktracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_mysql_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Disable H2 console for MySQL profile
spring.h2.console.enabled=false
