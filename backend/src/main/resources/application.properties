# ===========================
# Mini Trello - Task Tracker
# ===========================

# Server
server.port=8080

# Active Profile: set to 'mysql' to use MySQL, leave as 'h2' for in-memory dev DB
spring.profiles.active=h2

# ===========================
# H2 In-Memory DB (dev/demo)
# ===========================
spring.datasource.url=jdbc:h2:mem:tasktracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===========================
# Logging
# ===========================
logging.level.com.minitrello=DEBUG
